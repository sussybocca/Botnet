name = "botnet-api"
main = "worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# KV Namespaces for rate limiting and bot storage
# You need to create these first, then update the IDs
# kv_namespaces = [
#   { binding = "BOTNET_KV", id = "", preview_id = "" },
#   { binding = "BOTNET_BOTS", id = "", preview_id = "" }
# ]

# Environment variables - use wrangler secret put to set these
[vars]
ENVIRONMENT = "development"
# Don't put real API keys here - use: wrangler secret put SENDGRID_API_KEY
# Don't put real API keys here - use: wrangler secret put BOTNET_API_KEY

# Limits
[limits]
cpu_ms = 10000  # 10 seconds CPU time

# For initial deployment, keep it simple
[dev]
port = 8787
local_protocol = "http"
