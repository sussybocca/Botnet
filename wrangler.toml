name = "botnet"
main = "worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# ===== CORRECT DO BINDINGS =====
[durable_objects]
bindings = [
  { name = "PACKAGE_SYSTEM", class_name = "PackageSystemDO" },
  { name = "BOT_MANAGER", class_name = "BotManagerDO" },
  { name = "NETWORK_COMPILER", class_name = "NetworkCompilerDO" }
]

[[durable_objects.migrations]]
tag = "v1"
new_classes = ["PackageSystemDO", "BotManagerDO", "NetworkCompilerDO"]

# ===== CORRECT KV BINDINGS =====
[[kv_namespaces]]
binding = "BOT_NETWORKS"
id = "c4500e1168594bfb8d660a24b1236813"

[[kv_namespaces]]
binding = "USER_PACKAGES"
id = "82e9228716774b61837fde6e49758d07"

[[kv_namespaces]]
binding = "MODIFIED_PACKAGES"
id = "6acb8859f7df4d54a9ff9bc847e77cac"

# ===== OPTIONAL KV NAMESPACES =====
[[kv_namespaces]]
binding = "NETWORK_CODE"
id = "3b8a18bd5332467bad8e1c584705e08e"

[[kv_namespaces]]
binding = "PACKAGE_STORE"
id = "3ad64189fe7f49efb973c9eb06b87a7a"

[[kv_namespaces]]
binding = "BOT_STORE"
id = "59752ef1adf94b24a9cb882963f96644"

# ===== ENVIRONMENT VARIABLES =====
[vars]
BOTNET_API_URL = "https://botnet.firefly-worker.workers.dev"
NPM_REGISTRY = "https://registry.npmjs.org"
ENVIRONMENT = "production"
NETWORK_JS_VERSION = "2.0.0"
MAX_BOTS_PER_NETWORK = 1000
MAX_PACKAGES_PER_USER = 100
PACKAGE_TIMEOUT = 30000
NETWORK_TIMEOUT = 60000
ENABLE_CUSTOM_PACKAGES = "true"
ENABLE_TRANSFORMERS = "true"
ALLOW_NPM_REGISTRY = "true"
MAX_PACKAGE_SIZE = "10MB"
CACHE_TTL = 3600
MAX_NETWORK_SIZE = 5000

[triggers]
crons = ["0 * * * *", "0 0 * * *"]

[build]
command = "echo 'Botnet Worker Build'"
